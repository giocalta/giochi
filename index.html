<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noleggio Giochi da Tavolo - Caltagirone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-4 text-center flex flex-col md:flex-row justify-between items-center gap-3">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight cursor-pointer" onclick="mostraHome()">🎲 Il Mio Catalogo Giochi</h1>
        <p class="text-slate-300 text-xs">Noleggio giochi da tavolo a Caltagirone</p>
      </div>
      <button onclick="mostraHome()" id="btnTornaHomeHeader" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-4 py-2 rounded-xl transition-colors">
        <i class="fa-solid fa-arrow-left mr-1.5"></i> Torna al Catalogo
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-3 md:px-4 py-4 flex-grow w-full">
    
    <!-- SEZIONE CATALOGO (HOME) -->
    <div id="viewCatalogo">
      <div class="bg-white p-3 md:p-5 rounded-2xl shadow-sm border border-slate-200 mb-4 space-y-3">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3">
          
          <!-- Ricerca -->
          <div class="relative col-span-2 md:col-span-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="searchInput" placeholder="Cerca un gioco..." 
                   class="w-full pl-8 pr-3 py-1.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs">
          </div>

          <!-- Filtro Tipo -->
          <div>
            <select id="categoryFilter" class="w-full py-1.5 px-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs bg-white">
              <option value="">Tutti i Tipi</option>
            </select>
          </div>

          <!-- Filtro Stato -->
          <div>
            <select id="statusFilter" class="w-full py-1.5 px-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs bg-white">
              <option value="">Tutti gli Stati</option>
              <option value="disponibile">Solo Disponibili</option>
              <option value="noleggiato">Solo Noleggiati</option>
            </select>
          </div>

          <!-- Ordinamento -->
          <div class="col-span-2 md:col-span-1">
            <select id="sortOrder" class="w-full py-1.5 px-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs bg-white font-medium text-emerald-800">
              <option value="recenti">✨ Ultimi inseriti</option>
              <option value="az">🔤 Ordine A-Z</option>
              <option value="za">🔤 Ordine Z-A</option>
              <option value="voto">⭐ Voto più alto</option>
            </select>
          </div>

        </div>
      </div>

      <div id="loading" class="text-center py-10">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-300 border-t-emerald-600 mb-2"></div>
        <p class="text-slate-500 text-xs">Caricamento catalogo...</p>
      </div>

      <div id="errorMessage" class="hidden text-center py-10 bg-red-50 text-red-600 rounded-2xl border border-red-200 p-4">
        <p class="font-semibold text-xs mb-1">Impossibile caricare i dati dal foglio Google.</p>
        <p class="text-[10px] text-red-500">Verifica le impostazioni di condivisione del foglio.</p>
      </div>

      <!-- Elenco a colonna singola ultra-compatto (1 gioco per riga) -->
      <div id="gamesGrid" class="flex flex-col gap-2.5 mb-8"></div>
    </div>

    <!-- SEZIONE SCHEDA SINGOLO GIOCO -->
    <div id="viewGioco" class="hidden">
      <button onclick="mostraHome()" class="mb-4 inline-flex items-center gap-1.5 text-slate-600 hover:text-slate-900 font-medium text-xs">
        <i class="fa-solid fa-arrow-left"></i> Torna a tutti i giochi
      </button>

      <div id="dettaglioGiocoContainer" class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden"></div>
    </div>

  </main>

  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
    <p>© Noleggio Giochi da Tavolo - Caltagirone. Dati sincronizzati in tempo reale.</p>
  </footer>

  <script>
    const NUMERO_WHATSAPP = '393333455179';
    const SPREADSHEET_ID = '1ALGM_zFq0ES2E_evYvDP9bCw-_OkbMC7RQe_zSrGeEE';

    let giochiData = [];

    function generaSlug(testo) {
      return testo.toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_-]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function pulisciValore(val) {
      if (!val) return '';
      if (val.indexOf('Date(') !== -1) {
        const parts = val.split(',');
        if (parts.length >= 3) {
          return parts[2].replace(/\)/g, '').trim();
        }
      }
      return val;
    }

    function pulisciUrlFoto(url) {
      if (!url) return '';
      let clean = url.trim();
      let matchUrl = clean.match(/(https?:\/\/[^\s"']+)/i);
      if (matchUrl) clean = matchUrl[1];

      if (clean.indexOf('drive.google.com') !== -1) {
        let matchId = clean.match(/\/d\/([^\/]+)/) || clean.match(/id=([^&]+)/);
        if (matchId && matchId[1]) {
          return 'https://lh3.googleusercontent.com/d/' + matchId[1] + '=s800';
        }
      }

      return clean;
    }

    function ottieniLinkTutorial(cellObj, titoloGioco) {
      if (!cellObj) return '';

      let valV = (cellObj.v !== null && cellObj.v !== undefined) ? String(cellObj.v).trim() : '';
      let valF = (cellObj.f !== null && cellObj.f !== undefined) ? String(cellObj.f).trim() : '';
      
      let matchV = valV.match(/(https?:\/\/[^\s"']+)/i);
      if (matchV) return matchV[1];

      let matchF = valF.match(/(https?:\/\/[^\s"']+)/i);
      if (matchF) return matchF[1];

      if (valV.indexOf('youtube.com') !== -1 || valV.indexOf('youtu.be') !== -1) {
        return valV.startsWith('http') ? valV : 'https://' + valV;
      }

      if (titoloGioco && valV !== '') {
        return 'https://www.youtube.com/results?search_query=' + encodeURIComponent('tutorial ' + titoloGioco + ' gioco da tavolo');
      }

      return '';
    }

    function processGoogleSheetsData(json) {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('errorMessage');

      try {
        if (!json || !json.table || !json.table.rows) {
          throw new Error("Formato dati non valido");
        }

        const rows = json.table.rows;
        giochiData = [];

        rows.forEach(function(r, index) {
          const c = r.c || [];
          
          function getFormattedVal(idx) {
            if (!c[idx]) return '';
            let val = '';
            if (c[idx].f !== null && c[idx].f !== undefined) {
              val = String(c[idx].f).trim();
            } else if (c[idx].v !== null && c[idx].v !== undefined) {
              val = String(c[idx].v).trim();
            }
            return pulisciValore(val);
          }

          let rawFoto = (c[0] && (c[0].f || c[0].v)) ? String(c[0].f || c[0].v) : '';
          let foto = pulisciUrlFoto(rawFoto);
          let titolo = getFormattedVal(1);          // Colonna B: Titolo
          let persone = getFormattedVal(2);         // Colonna C: Persone
          let tempo = getFormattedVal(4) || '-';    // Colonna E: Tempo
          let difficolta = getFormattedVal(5);     // Colonna F: Difficoltà
          let tipo = getFormattedVal(6) || 'Generico'; // Colonna G: Tipo
          
          let tutorial = ottieniLinkTutorial(c[7], titolo); // Colonna H: Tutorial

          let eta = getFormattedVal(8);            // Colonna I: Età
          let voto = getFormattedVal(9);           // Colonna J: Voto (1-10)
          let peso = getFormattedVal(10);          // Colonna K: Peso
          let dispStr = getFormattedVal(11).toUpperCase(); // Colonna L: Disponibilità
          let descrizione = getFormattedVal(12);   // Colonna M: Descrizione

          if (!titolo || titolo.toLowerCase() === 'titolo') return;

          const isDisp = dispStr === '' || ['SI', 'SÌ', 'TRUE', 'DISPONIBILE', 'OK', '1'].indexOf(dispStr) !== -1;

          giochiData.push({
            id: generaSlug(titolo),
            ordineOriginale: index,
            titolo: titolo,
            tipo: tipo,
            persone: persone || '-',
            tempo: tempo,
            difficolta: difficolta,
            tutorial: tutorial,
            eta: eta,
            voto: voto,
            peso: peso,
            disponibile: isDisp,
            descrizione: descrizione || 'Nessuna descrizione dettagliata disponibile al momento.',
            foto: foto || 'https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?auto=format&fit=crop&w=500&q=80'
          });
        });

        loadingEl.classList.add('hidden');
        popolaFiltroCategorie();
        gestisciRouting();

      } catch (err) {
        console.error(err);
        loadingEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
      }
    }

    function renderGiochi(lista) {
      const gridEl = document.getElementById('gamesGrid');
      gridEl.innerHTML = '';

      if (lista.length === 0) {
        gridEl.innerHTML = '<p class="col-span-full text-center text-slate-400 py-6 text-xs">Nessun gioco trovato.</p>';
        return;
      }

      lista.forEach(function(g) {
        const statusBadge = g.disponibile 
          ? '<span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full font-semibold"><i class="fa-solid fa-check text-[9px] mr-1"></i>Disponibile</span>'
          : '<span class="bg-rose-100 text-rose-800 text-[10px] px-2 py-0.5 rounded-full font-semibold"><i class="fa-solid fa-clock text-[9px] mr-1"></i>Noleggiato</span>';

        const tutorialIcon = g.tutorial 
          ? '<a href="' + g.tutorial + '" target="_blank" rel="noopener noreferrer" title="Guarda Tutorial" onclick="event.stopPropagation();" class="absolute top-1 left-1 bg-red-600 text-white w-5 h-5 rounded-full flex items-center justify-center shadow z-10"><i class="fa-brands fa-youtube text-[10px]"></i></a>' 
          : '';

        let badgeVoto = '';
        if (g.voto) {
          badgeVoto = '<span class="text-xs font-bold text-amber-500 ml-2">⭐ ' + g.voto + '</span>';
        }

        let infoEta = g.eta ? '<span class="hidden sm:inline"><i class="fa-solid fa-child mr-1"></i>' + g.eta + '+ anni</span>' : '';
        let infoDiff = g.difficolta ? '<span class="hidden sm:inline"><i class="fa-solid fa-brain mr-1"></i>' + g.difficolta + '</span>' : '';

        const card = document.createElement('div');
        // Scheda orizzontale compatta a riga singola (Altezza limitata a ~95px)
        card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-row items-center hover:shadow-md transition-all cursor-pointer group h-24 sm:h-28 p-1.5 gap-2.5";
        card.onclick = function() { mostraDettaglioGioco(g.id); };
        
        card.innerHTML = 
          '<div class="w-24 sm:w-32 h-full bg-slate-200 overflow-hidden relative rounded-lg shrink-0">' +
            '<img src="' + g.foto + '" alt="' + g.titolo + '" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src=\'https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?auto=format&fit=crop&w=500&q=80\'">' +
            tutorialIcon +
          '</div>' +
          '<div class="flex-grow min-w-0 flex flex-col justify-between h-full py-0.5 pr-1">' +
            '<div>' +
              '<div class="flex items-center justify-between gap-1 mb-0.5">' +
                '<span class="text-[9px] sm:text-[10px] font-semibold text-emerald-600 uppercase tracking-tight truncate">' + g.tipo + '</span>' +
                statusBadge +
              '
